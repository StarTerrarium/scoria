[package]
name = "scoria-bin"
description = "The scoria binary: selects a frontend, and drives the core directly for debugging."
version.workspace = true
edition.workspace = true
# GitHub is the distribution channel, not crates.io (DESIGN.md 15). This makes a
# stray `cargo publish` fail rather than push a music player's internals to a registry.
publish = false
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "scoria"
path = "src/main.rs"

[dependencies]
scoria-core.workspace = true
scoria-gui.workspace = true
anyhow.workspace = true

[lints]
workspace = true
