[package]
name = "scoria-core"
description = "Library index, query engine and playback engine for Scoria. Depends on no UI crate."
version.workspace = true
edition.workspace = true
# GitHub is the distribution channel, not crates.io (DESIGN.md 15). This makes a
# stray `cargo publish` fail rather than push a music player's internals to a registry.
publish = false
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
toml.workspace = true
lofty.workspace = true
notify.workspace = true
rodio.workspace = true
ebur128.workspace = true
souvlaki.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Integration tests reach past the repository to simulate a corrupted database.
rusqlite.workspace = true
# Integration tests write real tags into real files, so the read path under
# test is the one that runs in production.
lofty.workspace = true

[lints]
workspace = true
