[workspace]
resolver = "3"
members = ["scoria-core", "scoria-bin", "scoria-gui"]

[workspace.package]
version = "1.0.0"
edition = "2024"
# Floor is set by lofty (1.89); iced needs 1.88, rodio 1.87.
rust-version = "1.89"
license = "GPL-3.0-only"
authors = ["Joel Smith"]
repository = "https://github.com/StarTerrarium/scoria"

# Every third-party version lives here and nowhere else. CLAUDE.md: do not bump a
# major or minor as part of an unrelated task.
[workspace.dependencies]
scoria-core = { path = "scoria-core" }
scoria-gui = { path = "scoria-gui" }

# UI. Only ever depended on by scoria-gui -- see scripts/check-boundaries.sh.
# Drawing album art needs an image codec. `image-without-codecs` plus an
# explicit codec list rather than iced's `image` feature, which pulls in AVIF
# *encoding* through rav1e -- a dependency chain that does not currently
# resolve, and that a music player has no use for either way.
#
# GUI only: scoria-core still has no image dependency, because it stores
# artwork exactly as found rather than rescaling it (DESIGN.md 5.3).
# `canvas` is for the transport's icons, which are drawn rather than typed.
# What it replaces: depending on whichever font the machine happens to have.
# Noto Sans -- what iced resolves SansSerif to -- carries none of the media
# symbols, so every one of them fell back, and the ones only a colour emoji
# font covered arrived orange with their colours baked in, past the theme.
# See DESIGN.md 8. It enables iced_graphics/geometry, which is lyon: iced's
# own tessellator rather than a foreign one.
iced = { version = "0.14", features = [
    "tokio",
    "image-without-codecs",
    "canvas",
] }

# Audio. rodio drives Symphonia itself through its own feature flags, so a direct
# symphonia dependency is not needed until gapless trimming (DESIGN.md 3.4) wants
# exact sample counts. When it is added it MUST stay on the version rodio resolves
# to -- rodio 0.22 pulls symphonia 0.5, and mismatching it links two copies of the
# decoder into the binary.
rodio = { version = "0.22", features = [
    # Beyond rodio's defaults (FLAC, MP3, MP4/AAC, Vorbis, WAV). Symphonia 0.5
    # decodes these and a library plausibly contains them; everything it cannot
    # decode is listed in DESIGN.md §5.2 and is not indexed.
    "symphonia-aiff",
    "symphonia-alac",
    "symphonia-adpcm",
] }
symphonia = "0.5"
# Loudness analysis (DESIGN.md 6.7): EBU R128 / ITU BS.1770 integrated loudness
# with gating, and sample peak. A pure-Rust port of libebur128, which is what
# rsgain itself measures with -- matching rsgain's numbers means using its
# algorithm, and loudness gating is easy to get subtly wrong by hand. What it
# replaces: asking users to install and run rsgain.
ebur128 = "0.1.11"

# Library and storage.
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
# Config file format. Human-editable is a requirement: DESIGN.md 7.3 sends users
# with exotic sort needs to the config file rather than building them a UI.
toml = "1"
# Native folder picker for §5.1's "point me at your library". Defaults to the
# XDG desktop portal, so no GTK. Nothing replaces it: a picker written by hand
# would be a worse picker, and a text field is not a picker at all.
rfd = "0.17"

# Desktop integration.
souvlaki = "0.8"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }

# Plumbing.
serde = { version = "1", features = ["derive"] }
# Dev-only: round-trip tests for the serialisable seam (DESIGN.md 3.2).
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }

[workspace.lints.rust]
# CLAUDE.md: do not use unsafe anywhere without asking first. `forbid` is the
# structural version of that -- it cannot be switched off by a local allow.
unsafe_code = "forbid"

[workspace.lints.clippy]
# The goal is no known way for the application to panic at runtime. These are the
# constructs that can take it down, denied at the workspace root so the build
# fails rather than waiting for someone to notice in review.
#
# Test modules opt out locally, at the top of `mod tests`:
#   #![allow(clippy::unwrap_used, clippy::indexing_slicing)]
# scripts/check-boundaries.sh reports any such allow outside a test module, so
# the escape hatch stays visible.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
panic_in_result_fn = "deny"

# Out-of-bounds indexing is the most likely remaining panic in a virtualised
# table over a changing library. Use .get() and handle the None.
indexing_slicing = "deny"
# Slicing a String on a non-char-boundary panics, and every string here comes
# from arbitrary tag metadata -- CJK titles make this a live concern, not theory.
string_slice = "deny"

float_cmp = "deny"
mem_forget = "deny"

# Deliberately NOT enabled: clippy::arithmetic_side_effects. It fires on every
# `i + 1` and would force checked arithmetic through index and duration code that
# cannot realistically overflow, at a real cost to readability -- which this
# codebase values (CLAUDE.md: prefer clear over clever). Overflow is instead
# handled by choosing types that cannot overflow in practice (u64 ids, Duration)
# and by using checked/saturating arithmetic explicitly where a value is derived
# from user input or file metadata. Integer division needs an explicit zero
# guard; there is no lint that catches that for us.
