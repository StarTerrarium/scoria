name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately no `RUSTFLAGS: -D warnings` here: it applies to every
  # dependency as well as to us, so a warning introduced by a new release of
  # iced or symphonia would fail this build for a reason nobody here can fix.
  # The clippy step denies warnings for our own crates, which is the part we
  # control and the part worth gating on.

jobs:
  check:
    name: fmt, clippy, test, invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every -sys crate here probes pkg-config from a build script, so a missing
      # header fails the build outright rather than at link time. Verified
      # against the dependency graph:
      #   alsa-sys     probes "alsa"           -> libasound2-dev  (rodio)
      #   libdbus-sys  probes "dbus-1"         -> libdbus-1-dev   (souvlaki, §12)
      #   wayland-sys  probes "wayland-client" -> libwayland-dev  (rfd, through
      #     the client_system feature: it links rather than dlopens, and the
      #     probe is an .unwrap())
      # libxkbcommon-dev is not proven necessary; it is winit's usual companion
      # and costs a second. This list is why the first run of this workflow
      # failed -- it had never run before, because there was no remote.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The invariants in CLAUDE.md that the compiler cannot express.
      - name: Invariants
        run: ./scripts/check-boundaries.sh

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libudev-dev
      # Kept in step with rust-version in the workspace manifest.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
